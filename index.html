<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Library & Chassis Editor · Standalone Block Editor</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .device-app-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .device-sidebar {
      background: var(--osc-bg-surface);
      border-right: 1px solid var(--osc-border-default);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .device-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .main-editor-stage {
      display: grid;
      grid-template-rows: auto 1fr 240px;
      overflow: hidden;
      background: var(--osc-bg-base);
    }

    .properties-bar {
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 10px;
      font-weight: 600;
      color: var(--osc-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chassis-preview-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1e1e24 0%, #121212 100%);
      overflow: auto;
    }

    .chassis-preview-panel svg {
      max-width: 95%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .ports-grid-panel {
      border-top: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ports-grid-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface-hover);
    }

    .ports-table-container {
      flex: 1;
      overflow: auto;
    }

    #device-port-table { font-size: 11px; }

    .discovery-status { font-size: 10px; color: var(--osc-text-muted); max-width: 240px; }
    .discovery-status[data-apk-state="dead"] { color: var(--apk-state-dead, #ef4444); }
    .discovery-status[data-apk-state="good"] { color: var(--apk-state-good, #22c55e); }
    .discovery-status[data-apk-state="kinda"] { color: var(--apk-state-kinda, #eab308); }
  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Device Library & Chassis Editor</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <span class="discovery-status" id="discovery-status" role="status"></span>
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Add what the bus has discovered to the list, as unsaved devices">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open block JSON">
        <span class="btn-icon">📂</span> Open
      </button>
      <span id="library-status" style="font-size:11px; color:var(--osc-text-muted); margin-right:8px;"></span>
      <button class="btn btn-secondary" id="btn-save-library" title="Save this device to the shared BIM library (DATABASE.server.BIM)">
        <span class="btn-icon">📚</span> Save to Library
      </button>
      <button class="btn btn-secondary" id="btn-export-ifc" title="Download this library part as its IFC4X3 type file (GET /api/bim/parts/&lt;id&gt;.ifc)">
        <span class="btn-icon">⬇</span> Export .ifc
      </button>
      <button class="btn btn-secondary" id="btn-import-ifc" title="Read an IFC type file into the editor (the server's importer, dry run); Save to Library then stores it">
        <span class="btn-icon">⬆</span> Import .ifc
      </button>
      <input type="file" id="input-import-ifc" accept=".ifc,model/step,application/x-step" hidden>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="device-app-container">
    <aside class="device-sidebar">
      <div class="sidebar-header">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11px; font-weight:700; color:var(--osc-text-muted); text-transform:uppercase;">Device Catalog</span>
          <button class="btn btn-primary btn-sm" id="btn-new-device">+ New</button>
        </div>
        <input type="text" id="search-input" class="input" placeholder="Search the BIM library (maker, model, connector)…">
      </div>
      <div class="device-list" id="device-list"></div>
      <div style="padding:8px; border-top:1px solid var(--osc-border-default); display:flex; gap:6px;">
        <button class="btn btn-secondary btn-sm" id="btn-duplicate-device" style="flex:1;">Duplicate</button>
        <button class="btn btn-secondary btn-sm" id="btn-delete-device" style="color:var(--osc-status-danger);">Delete</button>
      </div>
    </aside>

    <main class="main-editor-stage">
      <section class="properties-bar">
        <div class="form-group">
          <label for="input-manufacturer">Manufacturer</label>
          <input type="text" id="input-manufacturer" class="input">
        </div>
        <div class="form-group">
          <label for="input-model">Model Name</label>
          <input type="text" id="input-model" class="input">
        </div>
        <div class="form-group">
          <label for="input-part-number">Part Number</label>
          <input type="text" id="input-part-number" class="input">
        </div>
        <div class="form-group">
          <label for="select-category">Category</label>
          <select id="select-category" class="input">
            <option value="Audio">Audio / DSP</option>
            <option value="Network">Network Switch / Router</option>
            <option value="Video">Video / IPTV</option>
            <option value="Control">Control / Automation</option>
            <option value="Power">Power / PDU / UPS</option>
            <option value="Compute">Server / Compute</option>
            <option value="Wireless">Wireless / RF</option>
          </select>
        </div>
        <div class="form-group">
          <label for="input-ru">Rack Height (RU)</label>
          <input type="number" id="input-ru" class="input" min="1" max="10">
        </div>
        <div class="form-group">
          <label for="input-depth">Chassis Depth (mm)</label>
          <input type="number" id="input-depth" class="input">
        </div>
        <div class="form-group">
          <label for="input-power">Base Power (Watts)</label>
          <input type="number" id="input-power" class="input">
        </div>
        <div class="form-group">
          <label for="input-btu">Thermal Load (BTU/hr)</label>
          <input type="number" id="input-btu" class="input">
        </div>
      </section>

      <div class="chassis-preview-panel" id="chassis-preview-stage"></div>

      <section class="ports-grid-panel">
        <div class="ports-grid-header">
          <span style="font-size:11px; font-weight:600; text-transform:uppercase; color:var(--osc-text-muted);">
            Physical Ports & Interfaces (Live Editable)
          </span>
          <button class="btn btn-primary btn-sm" id="btn-add-port">+ Add Port Interface</button>
        </div>
        <div class="ports-table-container">
          <div id="device-port-table"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="./js/deviceApp.js"></script>
</body>
</html>
