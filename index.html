<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device & Equipment Chassis Editor — APK.audio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:12px; font-weight:600;">
      <span>📟</span>
      <span>Device & Chassis Editor</span>
      <span style="font-size:0.75rem; background:#1e293b; color:#38bdf8; padding:2px 8px; border-radius:12px;">Modular Frame</span>
    </div>
    <button class="primary" id="btn-export">Export Manifest</button>
  </header>

  <div class="main-layout">
    <div class="catalog">
      <h3 style="font-size:0.8rem; color:#94a3b8; text-transform:uppercase; margin-bottom:12px;">Available Cards</h3>
      <div id="card-catalog"></div>
    </div>

    <div class="chassis-view">
      <div class="frame-box">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #283347; padding-bottom:10px;">
          <div>
            <div style="font-weight:700; color:#f1f5f9; font-size:1.1rem;">DSP-MAINFRAME-01</div>
            <div style="font-size:0.8rem; color:#64748b;">4-Slot Modular Audio Processing Chassis</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.8rem; color:#94a3b8;">Power Draw: <span id="stat-power" style="color:#38bdf8; font-weight:700;">45 W</span></div>
            <div style="font-size:0.8rem; color:#94a3b8;">Total Ports: <span id="stat-ports" style="color:#34d399; font-weight:700;">0</span></div>
          </div>
        </div>

        <div class="slots-container" id="slots-container"></div>
      </div>
    </div>

    <div class="inspector">
      <h3 style="font-size:0.8rem; color:#94a3b8; text-transform:uppercase; margin-bottom:12px;">Slot Properties</h3>
      <div id="slot-details" style="color:#64748b; font-size:0.85rem;">Select an expansion slot to inspect card parameters.</div>
    </div>
  </div>

  <script type="module">
    import { EXPANSION_CARDS, DeviceChassisModel } from './js/deviceApp.js';

    const model = new DeviceChassisModel('DSP-MAINFRAME-01', 4);
    const catalogEl = document.getElementById('card-catalog');
    const slotsEl = document.getElementById('slots-container');
    const statPower = document.getElementById('stat-power');
    const statPorts = document.getElementById('stat-ports');
    const slotDetails = document.getElementById('slot-details');
    let selectedSlot = null;

    EXPANSION_CARDS.forEach(c => {
      const el = document.createElement('div');
      el.className = 'card-item';
      el.draggable = true;
      el.innerHTML = `
        <div style="font-weight:600; font-size:0.85rem; color:#f1f5f9;">${c.name}</div>
        <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">${c.type} · ${c.ports} Ports · ${c.powerW}W</div>
      `;
      el.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', c.id));
      catalogEl.appendChild(el);
    });

    function renderSlots() {
      slotsEl.innerHTML = '';
      model.slots.forEach(s => {
        const el = document.createElement('div');
        el.className = `slot-card ${s.card ? 'occupied' : ''} ${selectedSlot === s.slotNumber ? 'selected' : ''}`;
        if (s.card) {
          el.innerHTML = `
            <div style="font-size:0.75rem; color:#38bdf8; font-weight:600;">SLOT ${s.slotNumber}</div>
            <div style="font-size:0.85rem; font-weight:600; text-align:center; margin:8px 0; color:#f8fafc;">${s.card.name}</div>
            <div style="font-size:0.75rem; color:#94a3b8;">${s.card.ports} Ports · ${s.card.powerW}W</div>
            <button style="margin-top:10px; padding:2px 8px; font-size:10px; border-color:#ef4444; color:#ef4444;" data-eject="${s.slotNumber}">Eject</button>
          `;
          el.querySelector('[data-eject]').addEventListener('click', (ev) => {
            ev.stopPropagation();
            model.removeCard(s.slotNumber);
            renderSlots();
          });
        } else {
          el.innerHTML = `
            <div style="font-size:0.75rem; color:#64748b; font-weight:600;">SLOT ${s.slotNumber}</div>
            <div style="font-size:0.8rem; color:#475569; margin-top:8px;">[ Empty Slot ]</div>
            <div style="font-size:0.75rem; color:#475569; margin-top:4px;">Drop Card Here</div>
          `;
        }

        el.addEventListener('dragover', (e) => e.preventDefault());
        el.addEventListener('drop', (e) => {
          e.preventDefault();
          const cardId = e.dataTransfer.getData('text/plain');
          if (cardId) {
            model.installCard(s.slotNumber, cardId);
            renderSlots();
          }
        });

        el.addEventListener('click', () => {
          selectedSlot = s.slotNumber;
          renderSlots();
          renderInspector(s);
        });

        slotsEl.appendChild(el);
      });

      statPower.textContent = `${model.getTotalPower()} W`;
      statPorts.textContent = `${model.getTotalPorts()}`;
    }

    function renderInspector(slot) {
      if (!slot.card) {
        slotDetails.innerHTML = `<div style="font-size:0.85rem; color:#64748b;">Slot ${slot.slotNumber} is empty.</div>`;
        return;
      }
      slotDetails.innerHTML = `
        <div style="margin-bottom:12px;">
          <label style="font-size:0.75rem; color:#94a3b8; display:block;">Card Model</label>
          <div style="font-size:0.9rem; font-weight:600; color:#f1f5f9;">${slot.card.name}</div>
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:0.75rem; color:#94a3b8; display:block;">Channel Capacity</label>
          <div style="font-size:0.9rem; color:#38bdf8;">${slot.card.ports} Discrete Physical I/O</div>
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:0.75rem; color:#94a3b8; display:block;">Thermal Dissipation</label>
          <div style="font-size:0.9rem; color:#fbbf24;">${(slot.card.powerW * 3.412).toFixed(1)} BTU/hr (${slot.card.powerW}W)</div>
        </div>
      `;
    }

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `device-manifest-${model.name}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Default pre-installed card in slot 1
    model.installCard(1, 'card-mic8');
    model.installCard(2, 'card-out8');
    renderSlots();
  </script>
</body>
</html>
